<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10122b">
<title>无限極人生 · 曙光路</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="无限極人生">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="intro-hide opening-active">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="scanlines"></div>

  <div id="hud">
    <div class="hud-box"><span class="hud-k">¥</span><b id="hudMoney">268</b></div>
    <div class="hud-box"><span id="hudTime">08:00</span> <span class="hud-k" id="hudDay">D1</span></div>
    <div class="hud-box"><span id="hudWeather">晴 9°C</span></div>
    <div class="hud-box bars">
      <span class="bar"><i id="barSta"></i></span><span class="hud-k">体</span>
      <span class="bar"><i id="barMood"></i></span><span class="hud-k">心</span>
    </div>
    <div class="hud-box"><span class="hud-k" id="hudPlace">曙光路站</span></div>
    <button id="btnMusic" class="hud-box music-btn" title="🎵 配乐设置（N）">🎵</button>
    <button id="btnPhone" class="hud-box music-btn" title="📱 手机（P）">📱</button>
    <button id="btnPlay" class="hud-box music-btn" title="🎯 人生目标（T）">🎯</button>
  </div>

  <div id="minimapWrap" title="点击放大 / 还原小地图">
    <canvas id="minimap" width="96" height="64"></canvas>
    <div id="minimapLabel">—</div>
  </div>

  <div id="toast"></div>
  <div id="ticker"><span id="tickerText">无限極人生 · 欢迎来到曙光路</span></div>

  <div id="stickWrap" class="touch-only">
    <div id="stickBase"><div id="stickKnob"></div></div>
  </div>

  <div id="actionBtns">
    <button id="btnA" class="pbtn main"><b>A</b><small>交互</small></button>
    <button id="btnB" class="pbtn"><b>B</b><small>背包</small></button>
    <button id="btnC" class="pbtn"><b>C</b><small>蓝图</small></button>
    <button id="btnD" class="pbtn"><b>D</b><small>日志</small></button>
  </div>

  <div id="dialog" class="hidden">
    <div class="dlg-head"><span id="dlgTitle">对话</span></div>
    <div class="dlg-body" id="dlgText"></div>
    <div class="dlg-opts" id="dlgOpts"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="panel-head"><span id="panelTitle">面板</span><button id="panelClose" class="xbtn">×</button></div>
    <div class="panel-body" id="panelBody"></div>
    <div class="panel-foot" id="panelFoot"></div>
  </div>

  <div id="blueprint" class="hidden">
    <canvas id="bpCanvas" width="1200" height="800"></canvas>
    <button id="bpSwitch" class="bp-switch">⇄ 切到另一张设计稿</button>
    <div class="bp-tip">C / ESC 返回 · ⇄ 切换曙光路 / 迂龙路稿</div>
  </div>

  <div id="help">
    <div class="title-card">
      <div class="title-topbar">
        <span>◈ INFINITY LIVES / TITLE SCREEN</span>
        <span id="titleBuild">v1.4.0</span>
      </div>

      <div class="title-hero">
        <h1>无限<span>極</span>人生</h1>
        <div class="title-en">Infinite Lives</div>
        <div class="title-sub">曙光路 · 像素都市自由生活模拟</div>
      </div>

      <div class="title-screen-wrap">
        <canvas id="titleScreen" width="360" height="168"></canvas>
        <div class="title-screen-label"><span class="live-dot">●</span> 街区地面屏同步信号 · 版本 / 更新 / 主角状态 自动轮播</div>
      </div>

      <div class="title-start">
        <button id="btnStart" class="bigbtn">
          <span class="btn-arrow">◀</span>
          <span class="btn-main">开 始 游 戏</span>
          <span class="btn-arrow">▶</span>
          <small>START GAME / ENTER · 瞬移进入曙光路</small>
        </button>
      </div>

      <div class="title-foot">
        <span><b>WASD / 摇杆</b> 移动　<b>A/E</b> 交互　<b>B</b> 背包　<b>C</b> 蓝图　<b>N</b> 配乐　<b>P</b> 手机桌面　<b>T</b> 目标</span>
        <span>9°C SUNNY · 进度自动保存本机 · 纯前端离线可玩</span>
      </div>
    </div>
  </div>
</div>

<!-- 开场：只有视频，没有任何按钮 / 文字；点按或任意键可跳过，播完自动渐显标题 -->
<div id="opening" aria-hidden="true">
  <video id="openingVideo" src="media/opening.mp4" autoplay playsinline webkit-playsinline
         disablepictureinpicture preload="auto"></video>
</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/systems.js"></script>
<script src="js/estate.js"></script>
<script src="js/play.js"></script>
<script src="js/jobs.js"></script>
<script src="js/music.js"></script>
<script src="js/music-resume.js"></script>
<script src="js/music-extra.js"></script>
<script src="js/music-player.js"></script>
<script src="js/events.js"></script>
<script src="js/blueprint.js"></script>
<script src="js/ui.js"></script>
<script src="js/minimap.js"></script>
<script src="js/phone.js"></script>
<script src="js/main.js"></script>
<script src="js/title.js"></script>
<script src="js/opening.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
